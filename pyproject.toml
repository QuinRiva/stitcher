[project]
name = "stitcher"
version = "0.0.9"
description = "Single-schema LLM extraction with Pydantic validation and JSON-Patch repair. Trust the model to be mostly right; stitch the gaps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Carl" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "langchain-core>=0.3,<2",
    "jsonpatch>=1.33,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/QuinRiva/stitcher"
Issues = "https://github.com/QuinRiva/stitcher/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
